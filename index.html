<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Live Preview — free by wantedasa.dev</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; height:100%; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#0d1117; color:#e6edf3; padding:18px; text-align:center; }
  .tag { font-size:.8rem; color:#8b949e; }
  .note { font-size:.8rem; color:#6b7280; max-width:520px; }
  .row{display:flex;gap:12px;width:100%;max-width:620px;flex-wrap:nowrap}
  #md,#out{flex:1 1 0;min-width:0;height:170px;padding:12px;border-radius:10px;border:1px solid #30363d;background:#161b22}
  #md{font-family:ui-monospace,monospace;color:#e6edf3;resize:none}
  #out{overflow:auto;color:#e6edf3;text-align:left}
  #out h3{margin:.2em 0;color:#e6edf3}
  #out ul{margin:.3em 0;padding-left:1.2em}
  #out a{color:#58a6ff}
</style>
</head>
<body>
<div class="row"><textarea id="md" spellcheck="false"># Hello
**bold** and *italic*
- one
- two</textarea><div id="out"></div></div>
<p class="note">Minimal parser for demos — not a full CommonMark implementation.</p>
<script>
function render(s){
  s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s=s.replace(/^# (.*)$/gm,'<h3>$1</h3>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/\*(.+?)\*/g,'<i>$1</i>');
  s=s.replace(/^- (.*)$/gm,'<li>$1</li>');
  s=s.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');
  s=s.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>');
  return s;
}
var md=document.getElementById('md'),out=document.getElementById('out');
function u(){out.innerHTML=render(md.value);}
md.addEventListener('input',u);
u();
</script>
</body>
</html>
