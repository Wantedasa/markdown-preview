<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Live Preview — free by wantedasa.dev</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; height:100%; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#0d1117; color:#e6edf3; padding:18px; }
  .note { font-size:.78rem; color:#6b7280; max-width:560px; text-align:center; }
  .row{display:flex; gap:14px; width:100%; max-width:620px; flex-wrap:nowrap}
  .pane{flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:6px}
  .pane .lbl{font-size:.72rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:#8b949e}
  .box{flex:1; height:168px; padding:12px 14px; border-radius:10px; border:1px solid #30363d; background:#161b22; font-size:.9rem; line-height:1.5}
  #md{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:#e6edf3; resize:none; outline:none}
  #md:focus{border-color:rgba(47,129,247,.6)}
  #out{overflow:auto; text-align:left; color:#c9d1d9}
  #out h3{margin:.1em 0 .35em; color:#58a6ff; font-size:1.05rem; font-family:'Space Grotesk','Inter',sans-serif}
  #out ul{margin:.3em 0; padding-left:1.2em}
  #out a{color:#58a6ff; text-decoration:none}
  #out a:hover{text-decoration:underline}
  #out b,#out i{color:#e6edf3}
</style>
</head>
<body>
<div class="row">
  <div class="pane">
    <span class="lbl">Markdown</span>
    <textarea id="md" class="box" spellcheck="false"># Hello
**bold** and *italic*
- one
- two</textarea>
  </div>
  <div class="pane">
    <span class="lbl">Preview</span>
    <div id="out" class="box"></div>
  </div>
</div>
<p class="note">Minimal parser for demos — not a full CommonMark implementation.</p>
<script>
function render(s){
  s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s=s.replace(/^# (.*)$/gm,'<h3>$1</h3>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/\*(.+?)\*/g,'<i>$1</i>');
  s=s.replace(/^- (.*)$/gm,'<li>$1</li>');
  s=s.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');
  s=s.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>');
  return s;
}
var md=document.getElementById('md'),out=document.getElementById('out');
function u(){out.innerHTML=render(md.value);}
md.addEventListener('input',u);
u();
</script>
</body>
</html>
